
name: RaceDay API CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate project files
        run: |
          find . -name "*.csproj"
          find . -name "*.sln"

      - name: Restore dependencies
        run: dotnet restore "$(find . -name 'RaceDayApi.Tests.csproj' -print -quit)"

      - name: Build test project
        run: dotnet build "$(find . -name 'RaceDayApi.Tests.csproj' -print -quit)" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$(find . -name 'RaceDayApi.Tests.csproj' -print -quit)" --configuration Release --no-build
